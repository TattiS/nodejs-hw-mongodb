tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: >
  Updates contact data for a specific contact belonging to the authenticated user.
    Supports partial updates. Accepts optional file upload for contact photo.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    description: The ID of the contact to update
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Jane Smith'
          phoneNumber:
            type: string
            example: '+380987654321'
          email:
            type: string
            example: 'jane@example.com'
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: [work, home, personal]
            example: personal
          photo:
            type: string
            format: binary
            description: Image file to upload as contact photo
responses:
  '200':
    $ref: ../../../components/responses/200.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
