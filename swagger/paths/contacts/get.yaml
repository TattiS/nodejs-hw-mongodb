tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: >
  Returns a paginated list of contacts belonging to the authenticated user.
  You can filter contacts by type and favourite status, as well as sort and paginate the results.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      default: 1
      description: Page number for pagination (starts from 1)
  - in: query
    name: perPage
    schema:
      type: integer
      default: 10
      description: Number of contacts per page
  - in: query
    name: sortBy
    schema:
      type: string
      enum: [name, contactType, isFavourite, email]
      default: name
      description: Field to sort by
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      default: asc
      description: Sorting order
  - in: query
    name: contactType
    schema:
      type: string
      enum: [work, home, personal]
      description: Filter by contact type
  - in: query
    name: isFavourite
    schema:
      type: boolean
      description: Filter by favourite status (true or false)
responses:
  '200':
    $ref: ../../components/responses/200.yaml

  '401':
    $ref: ../../components/responses/401.yaml

  '500':
    $ref: ../../components/responses/500.yaml
